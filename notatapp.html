        container.appendChild(etiketterDiv);
      }

      const tekstDiv = document.createElement("div");
      tekstDiv.className = "disp-forhandsvis-tekst";
      tekstDiv.innerHTML = notat.tekst;
      container.appendChild(tekstDiv);

      if (notat.kilde) {
        const kildeDiv = document.createElement("div");
        kildeDiv.className = "disp-forhandsvis-kilde";
        const erUrl = notat.kilde.startsWith("http://") || notat.kilde.startsWith("https://");
        if (erUrl) {
          const lenke = document.createElement("a");
          lenke.href = notat.kilde;
          lenke.target = "_blank";
          lenke.rel = "noopener noreferrer";
          lenke.textContent = notat.kilde;
          kildeDiv.appendChild(document.createTextNode("Kilde: "));
          kildeDiv.appendChild(lenke);
        } else {
          kildeDiv.textContent = "Kilde: " + notat.kilde;
        }
        container.appendChild(kildeDiv);
      }
    }

    function visDisposisjon() {
      const panel = document.getElementById("disposisjon-panel");
      const disp = hentDisposisjon();
      panel.innerHTML = "";

      // Navigasjonslinje
      const alleListe = hentAlleDisposisjoner();
      const aktivId = hentAktivDispId();

      const navBar = document.createElement("div");
      navBar.className = "disp-nav";

      alleListe.forEach(function (d) {
        const knapp = document.createElement("button");
        knapp.className = "disp-nav-knapp" + (d.id === aktivId ? " aktiv" : "");
        knapp.textContent = d.tittel || "Uten tittel";
        knapp.title = d.tittel || "Uten tittel";
        knapp.addEventListener("click", function () {
          settAktivDispId(d.id);
          aktivtForhåndsvisNotatId = null;
          visDisposisjon();

        navBar.appendChild(knapp);

          return { id: Date.now() + i + 1, navn: navn, notatIds: [] };
        });
        const nyDisp = { id: Date.now(), tittel: "", seksjoner: seksjoner };
        const alle = hentAlleDisposisjoner();
        alle.push(nyDisp);
        lagreAlleDisposisjoner(alle);
        settAktivDispId(nyDisp.id);
        visDisposisjon();
      });
      navBar.appendChild(nyKnapp);

      eksportKnapp.className = "disp-eksport-knapp";
      eksportKnapp.textContent = "Eksporter ↓";
      eksportKnapp.title = "Last ned disposisjonen som tekstfil";
      eksportKnapp.addEventListener("click", function () {
        eksporterDisposisjon(hentDisposisjon());
      });
      navBar.appendChild(eksportKnapp);

      if (alleListe.length > 1) {

          settAktivDispId(alle[0].id);
          visDisposisjon();

        navBar.appendChild(slettDispKnapp);

      panel.appendChild(navBar);

        const knapp = document.createElement("button");
        knapp.className = "disp-sjanger-knapp" + (disp.sjanger === navn ? " aktiv" : "");
        knapp.textContent = navn;
        knapp.addEventListener("click", function () {
          const d = hentDisposisjon();
          d.sjanger = d.sjanger === navn ? "" : navn;
          lagreDisposisjon(d);
          sjangerRad.querySelectorAll(".disp-sjanger-knapp").forEach(function (k) {
            k.classList.toggle("aktiv", k.textContent === d.sjanger);
          });
          sjangerTagg.textContent = d.sjanger;
          sjangerTagg.style.display = d.sjanger ? "inline-block" : "none";
        });
        sjangerRad.appendChild(knapp);
      });
      venstre.appendChild(sjangerRad);

      const sjangerTagg = document.createElement("span");
      sjangerTagg.className = "disp-sjanger-tagg";
      sjangerTagg.textContent = disp.sjanger || "";
      sjangerTagg.style.display = disp.sjanger ? "inline-block" : "none";

      midtHeader.className = "disp-pool-header";
      midtHeader.textContent = "Notater";
      midt.appendChild(midtHeader);

      søkRad.className = "disp-pool-søk";

      const søkInputEl = document.createElement("input");
      søkInputEl.type = "text";
      søkInputEl.className = "disp-pool-søk-input";
      søkInputEl.placeholder = "Søk...";
      søkInputEl.value = dispPoolSøk;

      const tømKnapp = document.createElement("button");
      tømKnapp.className = "søk-tøm-knapp";
      tømKnapp.textContent = "✕";

      tømKnapp.addEventListener("click", function () {

      søkRad.appendChild(søkInputEl);
      søkRad.appendChild(tømKnapp);

      filterDiv.id = "disp-pool-filter";
      filterDiv.className = "disp-pool-filter";
      midt.appendChild(filterDiv);

      pool.id = "disp-midt-rutenett";
      pool.className = "disp-midt-rutenett";
      midt.appendChild(pool);

      // --- Høyrekolonne: Forhåndsvisning ---
      const forhandsvis = document.createElement("div");
      forhandsvis.className = "disp-forhandsvis";

      const fvHeader = document.createElement("div");
      fvHeader.className = "disp-forhandsvis-header";
      fvHeader.textContent = "Forhåndsvisning";
      forhandsvis.appendChild(fvHeader);

      const fvInnhold = document.createElement("div");
      fvInnhold.id = "disp-forhandsvis-inhalt";
      forhandsvis.appendChild(fvInnhold);

      layout.appendChild(venstre);
      layout.appendChild(midt);
      layout.appendChild(forhandsvis);
      panel.appendChild(layout);

      renderDispPoolFilter();
      renderDispPoolInhalt();
      renderDispForhåndsvis();
    }

    function settAppModus(modus) {
      appModus = modus;
      const erDisp = modus === "disposisjon";
      document.querySelector(".main").classList.toggle("disp-modus", erDisp);
      const skjulVedDisp = [
        document.querySelector(".editor-card"),
        document.querySelector(".søk-omrade"),
        document.getElementById("etikett-filter"),
        document.querySelector(".liste-header"),
        document.getElementById("notat-liste")
      ];
      skjulVedDisp.forEach(function (el) {
        if (el) el.style.display = erDisp ? "none" : "";
      });
      document.getElementById("disposisjon-panel").style.display = erDisp ? "block" : "none";
      document.getElementById("modus-notater").classList.toggle("aktiv", !erDisp);
      document.getElementById("modus-disposisjon").classList.toggle("aktiv", erDisp);
      if (erDisp) { visDisposisjon(); } else { visNotater(); }
    }

    // --- Høyreklikkmeny ---

    let kontekstNotatId = null;
    const kontekstMeny = document.getElementById("kontekst-meny");

    function lukkKontekstMeny() {
      kontekstMeny.classList.remove("synlig");
      kontekstNotatId = null;
    }

    function åpneKontekstMeny(e, notatId) {
      e.preventDefault();
      e.stopPropagation();
      kontekstNotatId = notatId;

      const menyBredde = 180;
      const menyHøyde = 80;
      const justerX = (e.clientX + menyBredde > window.innerWidth) ? e.clientX - menyBredde : e.clientX;
      const justerY = (e.clientY + menyHøyde > window.innerHeight) ? e.clientY - menyHøyde : e.clientY;

      kontekstMeny.style.left = justerX + "px";
      kontekstMeny.style.top = justerY + "px";
      kontekstMeny.classList.add("synlig");
    }

    document.getElementById("km-rediger").addEventListener("click", function () {
      if (kontekstNotatId === null) return;
      const notat = hentNotater().find(function (n) { return n.id === kontekstNotatId; });
      if (!notat) return;

      redigerNotatId = notat.id;
      valgteEtiketter = notat.etiketter ? notat.etiketter.slice() : (notat.etikett ? [notat.etikett] : []);
      input.innerHTML = notat.tekst;
      settRedigeringsmodus(true);
      oppdaterOrdteller();
      visEtiketter();
      visNotater();
      input.focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
      lukkKontekstMeny();
    });

    document.getElementById("km-slett").addEventListener("click", function () {
      if (kontekstNotatId === null) return;
      const idSomSlettes = kontekstNotatId;
      lukkKontekstMeny();
      const bekreft = confirm("Er du sikker på at du vil slette dette notatet? Dette kan ikke angres.");
      if (!bekreft) return;

      const notater = hentNotater().filter(function (n) { return n.id !== idSomSlettes; });
      lagreNotater(notater);
      if (redigerNotatId === idSomSlettes) {
        nullstillSkjema();
      } else {
        visNotater();
      }
    });

    document.addEventListener("click", function () {
      lukkKontekstMeny();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") lukkKontekstMeny();
    });
    document.addEventListener("scroll", lukkKontekstMeny, true);

    document.addEventListener("click", function () {
      const dropInnhold = document.getElementById("etikett-dropdown-innhold");
      if (dropInnhold) dropInnhold.classList.remove("aapen");
    });

    // Visning
    function oppdaterVisning() {
      const grid = document.getElementById("notat-liste");
      const knapp = document.getElementById("visning-knapp");
      const erKort = visningsModus === "kort";
      grid.classList.toggle("kortvisning", erKort);
      knapp.textContent = erKort ? "☰ Liste" : "⊞ Kort";
      knapp.classList.toggle("active", erKort);
    }

    document.getElementById("visning-knapp").addEventListener("click", function () {
      visningsModus = visningsModus === "liste" ? "kort" : "liste";
      localStorage.setItem("visning", visningsModus);
      oppdaterVisning();
    });

    oppdaterVisning();

    // Sortering
    document.getElementById("sorter-knapp").addEventListener("click", function () {
      sorteringsRekkefølge = sorteringsRekkefølge === "nyest" ? "eldst" : "nyest";
      this.textContent = sorteringsRekkefølge === "nyest" ? "Nyeste først ▾" : "Eldste først ▲";
      this.classList.toggle("active", sorteringsRekkefølge === "eldst");
      visNotater();
    });

    // Søk
    const søkInput = document.getElementById("søk-input");
    const søkTømKnapp = document.getElementById("søk-tøm-knapp");
    const søkKalenderKnapp = document.getElementById("søk-kalender-knapp");
    const søkDatoInput = document.getElementById("søk-dato-input");

    søkInput.addEventListener("input", function () {
      søkeTekst = this.value.trim().toLowerCase();
      søkTømKnapp.style.display = søkeTekst ? "inline-block" : "none";
      søkDatoInput.value = "";
      søkKalenderKnapp.classList.remove("aktiv");
      visNotater();
    });

    søkTømKnapp.addEventListener("click", function () {
      søkInput.value = "";
      søkeTekst = "";
      søkDatoInput.value = "";
      søkKalenderKnapp.classList.remove("aktiv");
      søkTømKnapp.style.display = "none";
      visNotater();
      søkInput.focus();
    });

    søkKalenderKnapp.addEventListener("click", function () {
      if (søkDatoInput.showPicker) {
        søkDatoInput.showPicker();
      } else {
        søkDatoInput.click();
      }
    });

    søkDatoInput.addEventListener("change", function () {
      if (!this.value) return;
      const dato = new Date(this.value + "T00:00:00");
      const datoTekst = dato.toLocaleDateString("nb-NO", { day: "numeric", month: "long", year: "numeric" });
      søkInput.value = datoTekst;
      søkeTekst = datoTekst.toLowerCase();
      søkTømKnapp.style.display = "inline-block";
      søkKalenderKnapp.classList.add("aktiv");
      visNotater();
    });

    // --- Formateringsverktøylinje ---

    document.querySelectorAll(".fmt-btn[data-cmd]").forEach(function (knapp) {
      knapp.addEventListener("mousedown", function (e) {
        e.preventDefault();
        document.execCommand(this.dataset.cmd, false, null);
        input.focus();
        oppdaterFmtKnapperStatus();
      });
    });

    document.getElementById("fmt-h2").addEventListener("mousedown", function (e) {
      e.preventDefault();
      const erH2 = document.queryCommandValue("formatBlock").toLowerCase() === "h2";
      document.execCommand("formatBlock", false, erH2 ? "div" : "h2");
      input.focus();
      oppdaterFmtKnapperStatus();
    });

    function oppdaterFmtKnapperStatus() {
      document.querySelector("[data-cmd='bold']").classList.toggle("aktiv", document.queryCommandState("bold"));
      document.querySelector("[data-cmd='italic']").classList.toggle("aktiv", document.queryCommandState("italic"));
      document.querySelector("[data-cmd='insertUnorderedList']").classList.toggle("aktiv", document.queryCommandState("insertUnorderedList"));
      document.getElementById("fmt-h2").classList.toggle("aktiv", document.queryCommandValue("formatBlock").toLowerCase() === "h2");
    }

    document.addEventListener("selectionchange", function () {
      if (document.activeElement === input) {
        oppdaterFmtKnapperStatus();
      }
    });

    // Modus
    document.getElementById("modus-notater").addEventListener("click", function () { settAppModus("notater"); });
    document.getElementById("modus-disposisjon").addEventListener("click", function () { settAppModus("disposisjon"); });

    // Start
    visEtiketter();
    visNotater();
  </script>

</body>
</html>
